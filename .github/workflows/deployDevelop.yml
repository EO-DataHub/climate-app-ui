name: Deploy demo branch build

on:
  push:
    branches:
      ['develop', 'demo', '178-github-actiion-for-different-deployments']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      output_build_s3: ${{ steps.artifact-upload-step.outputs.artifact-id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Build project
        uses: borales/actions-yarn@v5
        with:
          cmd: build
        env:
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH }}
          VITE_EODH_BASE_URL: ${{ secrets.VITE_EODH_BASE_URL }}

      - name: Copy index.html to 404.html to satisfy GitHub Pages + front-end routing
        run: cp dist/index.html dist/404.html

      - name: Upload build files for gh pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload build files for s3
        uses: actions/upload-artifact@v4
        id: artifact-upload-step
        with:
          name: s3_build
          path: ./dist

  deploy_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/demo'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_s3:
    env:
      output_build_s3: ${{needs.build.outputs.output_build_s3}}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/178-github-actiion-for-different-deployments'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Install Deploy Requirements
        if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'iac/')
        run: pip install -r iac/requirements.txt

      - name: CDK Deploy
        if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'iac/')
        run: cd iac && cdk deploy --require-approval never     

      - name: Download artifacts and copy website to S3
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          name: s3_build      
      - run: |
          aws s3 sync ./dist s3://${{ secrets.AWS_BUCKET_NAME }}
          aws s3 sync ./dist/assets s3://${{ secrets.AWS_BUCKET_NAME }}/${{ secrets.VITE_BASE_PATH }}
          
          
