name: Deploy demo branch build

on:
  push:
    branches:
      - develop
      - demo
      - 178-github-actiion-for-different-deployments

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-deployment-${{ github.ref }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      output_build_s3: ${{ steps.artifact-upload-step.outputs.artifact-id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Build for develop
        uses: borales/actions-yarn@v5
        if: startsWith(github.ref, 'refs/heads/develop') || startsWith(github.ref, 'refs/heads/178-github-actiion-for-different-deployments')
        with:
          cmd: build
        env:
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_EODH_BASE_URL: ${{ vars.VITE_EODH_BASE_URL }}

      - name: Build for demo
        uses: borales/actions-yarn@v5
        if: startsWith(github.ref, 'refs/heads/demo')
        with:
          cmd: build
        env:
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_EODH_BASE_URL: ${{ vars.VITE_EODH_BASE_URL }}

      - name: Upload build files for s3
        uses: actions/upload-artifact@v4
        id: artifact-upload-step
        with:
          name: s3_build
          path: ./dist

  deploy_s3:
    env:
      output_build_s3: ${{needs.build.outputs.output_build_s3}}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Deploy Requirements
        run: pip install -r iac/requirements.txt

      - name: CDK Deploy
        if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'iac/')
        run: cd iac && cdk deploy --all --require-approval never

      - name: Download artifacts and copy website to S3 if develop branch
        if: startsWith(github.ref, 'refs/heads/develop')
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          name: s3_build

      - name: List files in ./dist for debugging
        if: startsWith(github.ref, 'refs/heads/develop')
        run: ls -la ./dist

      - name: transfer to S3
        if: startsWith(github.ref, 'refs/heads/develop')
        run: |
          aws s3 sync ./dist s3://develop-eodh-website-files

      - name: Download artifacts and copy website to S3 if demo branch
        if: startsWith(github.ref, 'refs/heads/demo') || startsWith(github.ref, 'refs/heads/178-github-actiion-for-different-deployments')
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          name: s3_build

      - name: transfer to s3
        if: startsWith(github.ref, 'refs/heads/demo') || startsWith(github.ref, 'refs/heads/178-github-actiion-for-different-deployments')
        run: aws s3 sync ./dist s3://demo-eodh-website-files
